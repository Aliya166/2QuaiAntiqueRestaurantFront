<div class="hero-scene text-center text-white">
    <div class="hero-scene-content">
        <h1>Galerie</h1>
    </div>
</div>

<div class="container">
    <div class="text-center">
        <button  id="btnAddphoto"type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#EditionPhotoModal" data-show="ROLE_ADMIN">Ajouter une photo</button>
    </div>
    <div class="row row-cols-2 row-cols-lg-3" id="allImages">
    </div>
    <div class="col-12 text-center mt-3">
        <a href="/reserver" onclick="route(event)" class="btn btn-primary">Réserver</a>    
    </div> 
</div>

<!-- Modal edition -->
<div class="modal fade" id="EditionPhotoModal" tabindex="-1" aria-labelledby="EditionPhotoModalLabel">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title fs-5" id="EditionPhotoModalLabel">Edition Photo</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
            <form id="addPhotoForm">
                <input type="hidden" id="photoIdInput">
                <div class="mb-3">
                  <label for="NamePhotoInput" class="form-label">Titre</label>
                  <input type="text" class="form-control" id="NamePhotoInput" placeholder="Lasagnes à la bolognese" name="Titre"> 
                </div>
                <div class="mb-3">
                  <label for="ImageInput" class="form-label">Image</label>
                  <input type="file" class="form-control" id="ImageInput"  name="Image">
                </div>
                <div class="text-center">
                    <button type="button" class="btn btn-primary" id="btnSavePhoto">Enregistrer</button>
                </div>
            </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal suppression -->
<div class="modal fade" id="deletePhotoModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content bg-dark text-white border border-danger">

      <div class="modal-header border-danger">
        <h5 class="modal-title">
          Supprimer la photo
        </h5>

        <button
          type="button"
          class="btn-close btn-close-white"
          data-bs-dismiss="modal">
        </button>
      </div>

      <div class="modal-body text-center">
        <p>
          Voulez-vous vraiment supprimer cette image ?
        </p>
      </div>

      <div class="modal-footer border-danger">

        <button
          type="button"
          class="btn btn-secondary"
          data-bs-dismiss="modal">
          Annuler
        </button>

        <button
          type="button"
          class="btn btn-danger"
          id="confirmDeletePhotoBtn">
          Oui supprimer
        </button>

      </div>

    </div>
  </div>
</div>
