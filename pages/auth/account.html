<div class="hero-scene text-center text-white">
  <div class="hero-scene-content">
    <h1>Mon compte</h1>
  </div>
</div>

<div class="container">
  <form id="accountForm">
    <div class="mb-3">
      <label for="NomInput" class="form-label">Nom</label>
      <input type="text" class="form-control" id="NomInput" placeholder="Votre nom" name="Nom">
    </div>

    <div class="mb-3">
      <label for="PrenomInput" class="form-label">Prénom</label>
      <input type="text" class="form-control" id="PrenomInput" placeholder="Votre prénom" name="Prenom">
    </div>

    <div class="mb-3">
      <label for="EmailInput" class="form-label">Email</label>
      <input type="email" class="form-control" id="EmailInput" placeholder="Votre email" name="Email">
    </div>

    <div class="mb-3">
      <label for="AllergieInput" class="form-label">Allergies</label>
      <input type="text" class="form-control" id="AllergieInput" placeholder="Vos allergies" name="Allergies">
    </div>

    <div class="text-center">
      <button type="submit" class="btn btn-primary">
        Modifier vos informations
      </button>
    </div>
  </form>

  <div class="text-center pt-3">
    <a href="/editPassword" onclick="route(event)">
      Cliquez ici pour modifier votre mot de passe
    </a>
  </div>
</div>

<div class="modal fade" id="successAccountModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content rounded-4">
      <div class="modal-header">
        <h5 class="modal-title" id="successAccountModalTitle">Succès</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <p id="successAccountModalMessage" class="mb-0"></p>
      </div>

      <div class="modal-footer">
        <button class="btn btn-primary" data-bs-dismiss="modal">OK</button>
      </div>
    </div>
  </div>
</div>
