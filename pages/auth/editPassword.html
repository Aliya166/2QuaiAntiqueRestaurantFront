<div class="hero-scene text-center text-white">
  <div class="hero-scene-content">
    <h1>Changement de mot de passe</h1>
  </div>
</div>

<div class="container">
  <form id="editPasswordForm">
    <div class="mb-3">
      <label for="PasswordInput" class="form-label">Nouveau mot de passe</label>
      <input type="password" class="form-control" id="PasswordInput" name="Password">
    </div>

    <div class="mb-3">
      <label for="ValidatePasswordInput" class="form-label">Confirmez le nouveau mot de passe</label>
      <input type="password" class="form-control" id="ValidatePasswordInput" name="PasswordConfirm">
    </div>

    <div class="text-center">
      <button type="submit" class="btn btn-primary">
        Changer mon mot de passe
      </button>
    </div>
  </form>

  <div class="text-center pt-3">
    <a href="/account" onclick="route(event)">
      Modifier mes informations personnelles
    </a>
  </div>
</div>

<div class="modal fade" id="successPasswordModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content rounded-4">

      <div class="modal-header">
        <h5 class="modal-title">🔒 Mot de passe modifié</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body text-center">
        <p>
          Votre mot de passe a été modifié avec succès.
        </p>
      </div>

      <div class="modal-footer">
        <button class="btn btn-primary" data-bs-dismiss="modal">
          OK
        </button>
      </div>

    </div>
  </div>
</div>
