<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="scss/main.css"/>
    <title>Quai Antique</title>
</head>
<body>

       <header>
        <nav class="navbar navbar-expand-lg bg-dark" data-bs-theme="dark">
            <div class="container-fluid">
              <a class="navbar-brand" href="/">Quai Antique</a>
              <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
              </button>
              <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                  <li class="nav-item">
                    <a class="nav-link" href="/" onclick="route(event)">Accueil</a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link" href="/galerie" onclick="route(event)">Galerie</a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link" href="/carte" onclick="route(event)">La carte</a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link" href="/reserver" onclick="route(event)">Les réservations</a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link" href="/account" onclick="route(event)">Mon compte</a>
                  </li>
                  <li class="nav-item" data-show="disconnected">
                    <a class="nav-link" href="/signin" onclick="route(event)">Connexion</a>
                  </li>
                  <li class="nav-item" data-show="connected">
                    <button class="nav-link" id="signout-btn" onclick="signOut()">Déconnexion</button>
                  </li>
                </ul>
              </div>
            </div>
          </nav>
    </header>

    <main id="main-page">
        <!--Le contenu de la page sera injectée ici-->
    </main>

       <footer class="bg-dark text-white text-center footer">
        <div class="row">
            <div class="col-12 col-lg-4">
                <h3 class="text-primary">Nos horaires</h3>
                <p>Du mardi au dimanche  12:00-14:00  18:00-23:00</p>
            </div>
            <div class="col-6 col-lg-4">
                <p>Quai Antique <br/>
                    5 rue de la route <br/>
                    31150 Ville <br/>
                    01 01 01 01 01 <br/>
                </p>
            </div>
            <div class="col-6 col-lg-4">
                <p>contact@quaiantique.com</p>
            </div>
        </div>
    </footer>
    <script src="js/auth/script.js"></script>
    <script type="module" src="/Router/router.js"></script>
    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <div class="modal fade" id="reservationConfirmModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Réservation confirmée</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        Votre réservation est confirmée.
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" data-bs-dismiss="modal">OK</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
